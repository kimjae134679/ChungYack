name: Build ChungYack Android APK

on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'package.json'
      - 'capacitor.config.json'
      - 'VERSION'
      - 'scripts/qa-app.mjs'
      - '.github/workflows/android.yml'
      - 'ops/android-rebuild.request'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chungyack-android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: ver
        shell: bash
        run: echo "version=$(tr -d '\r\n ' < VERSION)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: UI and data QA
        run: npm run qa

      - name: Create Android project
        run: npx cap add android

      - name: Sync web bundle
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "ChungYack-Radar-v${{ steps.ver.outputs.version }}-debug.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: ChungYack-Radar-v${{ steps.ver.outputs.version }}-debug-apk
          path: ChungYack-Radar-v${{ steps.ver.outputs.version }}-debug.apk
          retention-days: 90

      - name: Publish APK release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="apk-v${{ steps.ver.outputs.version }}"
          APK="ChungYack-Radar-v${{ steps.ver.outputs.version }}-debug.apk"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "청약 레이더 v${{ steps.ver.outputs.version }}" --notes "청약 추적 + SH 현실추천 + 과거 경쟁률 추정 모바일 대시보드 초기 APK"
          gh release upload "$TAG" "$APK" --clobber

      - name: Record latest build
        if: success()
        run: |
          mkdir -p ops
          printf '{\n  "version": "%s",\n  "run_id": %s,\n  "status": "success",\n  "artifact": "ChungYack-Radar-v%s-debug-apk",\n  "release_tag": "apk-v%s"\n}\n' "${{ steps.ver.outputs.version }}" "${{ github.run_id }}" "${{ steps.ver.outputs.version }}" "${{ steps.ver.outputs.version }}" > ops/android-latest-run.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase || true
          git add ops/android-latest-run.json
          git commit -m "Record ChungYack Android build ${{ github.run_id }}" || true
          git push || true
