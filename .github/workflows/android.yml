name: Build ChungYack Android APK

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Runner probe
        run: |
          echo "CHUNGYACK_ACTIONS_RUNNER_OK"
          uname -a
          pwd
