name: Build ChungYack Android APK

on:
  push:
    branches: [main]
    paths:
      - 'public/index.html'
      - 'public/manifest.webmanifest'
      - 'public/assets/**'
      - 'public/data/app.json'
      - 'public/data/current-opportunities.json'
      - 'public/data/discovery-extra.json'
      - 'public/data/sh-happy-2026-2-youth.json'
      - 'public/data/sh-2026.csv'
      - 'public/data/report-overrides.json'
      - 'package.json'
      - 'capacitor.config.json'
      - 'VERSION'
      - 'scripts/qa-app.mjs'
      - 'scripts/apply-android-branding.mjs'
      - '.github/workflows/android.yml'
      - 'ops/android-rebuild.request'
  pull_request:
    branches: [main]
    paths:
      - 'public/index.html'
      - 'public/manifest.webmanifest'
      - 'public/assets/**'
      - 'public/data/app.json'
      - 'public/data/current-opportunities.json'
      - 'public/data/discovery-extra.json'
      - 'public/data/sh-happy-2026-2-youth.json'
      - 'public/data/sh-2026.csv'
      - 'public/data/report-overrides.json'
      - 'package.json'
      - 'capacitor.config.json'
      - 'VERSION'
      - 'scripts/**'
      - '.github/workflows/android.yml'
      - 'ops/android-rebuild.request'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chungyack-android-build-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: ver
        shell: bash
        run: echo "version=$(tr -d '\r\n ' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Publish build run pointer
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p ops
          printf '{\n  "version": "%s",\n  "run_id": %s,\n  "status": "building",\n  "artifact": "ChungYack-Radar-v%s-debug-apk",\n  "release_tag": "apk-v%s"\n}\n' "${{ steps.ver.outputs.version }}" "${{ github.run_id }}" "${{ steps.ver.outputs.version }}" "${{ steps.ver.outputs.version }}" > ops/android-latest-run.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/android-latest-run.json
          git commit -m "Record ChungYack Android build ${{ github.run_id }} started" || true
          git push || true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: UI and data QA
        run: |
          npm run qa
          node --check public/assets/app.js
          node --check public/assets/app-v2-fixes.js
          node --check public/assets/app-v3.js
          node --check public/assets/app-v4.js
          node --check public/assets/app-v5.js
          node --check public/assets/app-v6.js
          node --check public/assets/app-v61.js
          node --check public/assets/app-v7.js
          node --check public/sw.js
          node --check scripts/qa-app.mjs
          node --check scripts/apply-android-branding.mjs
          node -e "JSON.parse(require('fs').readFileSync('public/data/hourly-report.json','utf8')); const x=JSON.parse(require('fs').readFileSync('public/data/current-opportunities.json','utf8')); const d=JSON.parse(require('fs').readFileSync('public/data/discovery-extra.json','utf8')); const h=JSON.parse(require('fs').readFileSync('public/data/sh-happy-2026-2-youth.json','utf8')); if(!x.items?.some(v=>v.id==='sh-happy-2026-2')) process.exit(2); if(!x.items?.some(v=>v.id==='sh-mirinae-8-2026')) process.exit(3); if(!d.items?.some(v=>v.id==='sns-gukmin-1973-duplicate-20260901')) process.exit(4); if(h.officialFinal!==false||h.screenCandidates?.length!==8||!h.rows?.some(v=>v.key==='euntteulak-39'&&v.supply===25&&v.reserve===41)) process.exit(5);"
          test -s public/assets/app-v2.css
          test -s public/assets/app-v3.css
          test -s public/assets/app-v4.css
          test -s public/assets/app-v5.css
          test -s public/assets/app-v6.css
          test -s public/assets/app-v61.css
          test -s public/assets/app-v7.css
          test -s public/data/current-opportunities.json
          test -s public/data/discovery-extra.json
          test -s public/data/sh-happy-2026-2-youth.json
          test -s public/data/sh-2026.csv
          grep -q 'viewport-fit=cover' public/index.html
          grep -q 'safe-area-inset-bottom' public/assets/app.css
          grep -q 'trackingEditor' public/index.html
          grep -q 'app-v2-fixes.js' public/index.html
          grep -q 'app-v3.js' public/index.html
          grep -q 'app-v4.js' public/index.html
          grep -q 'app-v5.js' public/index.html
          grep -q 'app-v6.js' public/index.html
          grep -q 'app-v61.js' public/index.html
          grep -q 'app-v7.js' public/index.html
          grep -q 'app-v5.css' public/index.html
          grep -q 'app-v6.css' public/index.html
          grep -q 'app-v61.css' public/index.html
          grep -q 'app-v7.css' public/index.html
          grep -q 'app-icon.svg' public/manifest.webmanifest
          grep -q 'exportLocalBtn' public/index.html
          grep -q '취소/추적중단' public/index.html
          grep -q '공고 숨기기' public/index.html
          grep -q '공고 저장' public/index.html
          grep -q 'cyRestoreRemoved' public/assets/app-v3.js
          grep -q 'chungyack-local-backup-v1' public/assets/app-v3.js
          grep -q 'current-opportunities.json' public/assets/app-v4.js
          grep -q 'CY_V7_VERSION' public/assets/app-v7.js
          grep -q 'CY_V7_HIDDEN_KEY' public/assets/app-v7.js
          grep -q 'CY_V7_SAVED_KEY' public/assets/app-v7.js
          grep -q 'data-cy-v7-save' public/assets/app-v7.js
          grep -q 'data-cy-v7-hide' public/assets/app-v7.js
          grep -q 'savedOpportunities' public/assets/app-v7.js
          grep -q 'hiddenOpportunities' public/assets/app-v7.js
          grep -q '4576036' public/data/current-opportunities.json
          grep -q 'SH 2026년 국민임대주택' public/data/current-opportunities.json
          grep -q '1,973세대' public/data/discovery-extra.json

      - name: Create Android project
        run: npx cap add android

      - name: Sync web bundle
        run: npx cap sync android

      - name: Apply ChungYack icon and native Back behavior
        run: npm run android:brand

      - name: Verify Android branding
        run: |
          test -s android/app/src/main/res/drawable/chungyack_icon_foreground.xml
          test -s android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          test -s android/app/src/main/java/com/kimjae134679/chungyack/MainActivity.java
          grep -q '청약 레이더' android/app/src/main/java/com/kimjae134679/chungyack/MainActivity.java

      - name: Restore persistent debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: chungyack-radar-debug-keystore-v1

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "ChungYack-Radar-v${{ steps.ver.outputs.version }}-debug.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: ChungYack-Radar-v${{ steps.ver.outputs.version }}-debug-apk
          path: ChungYack-Radar-v${{ steps.ver.outputs.version }}-debug.apk
          retention-days: 90

      - name: Publish APK release asset
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="apk-v${{ steps.ver.outputs.version }}"
          APK="ChungYack-Radar-v${{ steps.ver.outputs.version }}-debug.apk"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "청약 레이더 v${{ steps.ver.outputs.version }}" --notes "관심 공고 저장·모아보기, 신청했음·추적중 표시와 필터, 공고 숨기기/복원, 추적 수정·상태변경, 삭제 되돌리기, JSON 백업/복원을 포함합니다. 기존 관심·북마크는 하나의 저장 상태로 자동 이관합니다."
          if gh release view "$TAG" --json assets --jq '.assets[].name' | grep -Fxq "$APK"; then
            echo "Release asset already exists; preserving it for signing continuity."
          else
            gh release upload "$TAG" "$APK"
          fi

      - name: Record successful build
        if: success() && github.event_name != 'pull_request'
        run: |
          git pull --rebase || true
          mkdir -p ops
          printf '{\n  "version": "%s",\n  "run_id": %s,\n  "status": "success",\n  "artifact": "ChungYack-Radar-v%s-debug-apk",\n  "release_tag": "apk-v%s",\n  "signing_cache": "chungyack-radar-debug-keystore-v1"\n}\n' "${{ steps.ver.outputs.version }}" "${{ github.run_id }}" "${{ steps.ver.outputs.version }}" "${{ steps.ver.outputs.version }}" > ops/android-latest-run.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/android-latest-run.json
          git commit -m "Record ChungYack Android build ${{ github.run_id }} successful" || true
          git push || true

      - name: Record failed build
        if: failure() && github.event_name != 'pull_request'
        run: |
          git pull --rebase || true
          mkdir -p ops
          printf '{\n  "version": "%s",\n  "run_id": %s,\n  "status": "failed",\n  "artifact": "ChungYack-Radar-v%s-debug-apk",\n  "release_tag": "apk-v%s"\n}\n' "${{ steps.ver.outputs.version }}" "${{ github.run_id }}" "${{ steps.ver.outputs.version }}" "${{ steps.ver.outputs.version }}" > ops/android-latest-run.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/android-latest-run.json
          git commit -m "Record ChungYack Android build ${{ github.run_id }} failed" || true
          git push || true
